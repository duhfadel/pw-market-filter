name: Coletar e publicar

# One version and then its name, so a failed run can be told apart from the
# air: `display_title` is what `tool/cron/worker.js` reads to know which
# market to redispatch after an isolated failure (see `ressuscitarColeta`).
run-name: Coletar e publicar — ${{ inputs.server || 'pw187' }}

# Every thirty minutes, at :07 and :37 — and the odd minutes are the point.
#
# **`schedule` is best effort, and the measurement is much worse than the
# docs suggest.** Asking for `*/20` never once delivered twenty minutes: over
# 26–29/08 the gap between scheduled runs went from ~45 minutes to 2 hours to
# 10, and one stretch reached 12h15 with no run at all. Nothing failed and
# nothing was cancelled — the schedule simply did not fire. The repository is
# public, so Actions minutes are unlimited; this is GitHub shedding load, and
# a busier cron is the first thing it sheds.
#
# So the times avoid the top of the hour, which GitHub names as its worst
# window, and the rate asks for less. Neither is a guarantee. If the gaps stay
# in hours, the fix is not in this file: it is an external cron — a Cloudflare
# Worker, where the site already lives — calling `workflow_dispatch`.
#
# The collection date is on screen for exactly this reason, and it is what
# tells a visitor the market went stale.
#
# **This fallback always names `pw187`.** `schedule` and `push` carry no
# `inputs`, so `${{ inputs.server || 'pw187' }}` below falls back to the
# version that has existed the longest and already has a public tool pointed
# at it. The Worker now alternates four cron triggers, two per version —
# `tool/cron/wrangler.toml` has the full arithmetic — and this fallback only
# ever fires `pw187`, so it agrees with the Worker's own `pw187` slots, `:07`
# and `:37`, rather than also firing at `:22` and `:52`, which are the
# Worker's `pw126` slots: a `pw187` dispatch at those minutes would not be
# wrong, but it would not agree with what the reliable clock is doing at the
# same instant either, and this is meant to be read beside it. This trigger
# is the slow, unreliable backstop for the version that matters most if the
# Worker goes quiet.
on:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      server:
        description: 'Qual mercado colher'
        required: false
        default: pw187
        type: choice
        options:
          - pw187
          - pw126
      # O levantamento único de um item que acabou de entrar na vigia. Só
      # existe em disparo manual e nunca no horário, de propósito: lista quem
      # **já** carrega, e o horário repeti-lo-ia de meia em meia hora para
      # sempre. O feed normal responde à outra pergunta, quem acabou de
      # chegar, e essa é dita uma vez por pessoa.
      catchup:
        description: 'Listar quem já carrega este item (nome exato, opcional)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# Never two collections at once against the same site, and never a half-written
# deploy. A run already in flight wins; the next schedule picks up its state.
#
# This still has to hold with two versions alternating: both pw187 and pw126
# runs join the SAME group, on purpose — two concurrent `upload-pages-artifact`
# calls collide on the Pages artifact (`Multiple artifacts named "github-pages"
# were unexpectedly found`, recorded in CLAUDE.md), and a deploy that races
# another deploy can publish half of each. One job, alternating, is the whole
# point: see CLAUDE.md on why this is not two workflows.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # A first run crawls every page at one request every 1.5 s. The rest
    # finish in under a minute.
    #
    # Seventy-five and not fifty because of 2026-08-19: the anecdotes and the
    # inventory are not in any state written before them, so every entry was
    # stale and the whole market was fetched again — about forty minutes of
    # crawling, plus analyze, test, build and deploy. If the job times out the
    # cache is never written and the next run starts from zero, so the ceiling
    # has to clear a full crawl with room to spare.
    #
    # Not raised for pw126 specifically: its listing is smaller than pw187's
    # (measured 01/10/2026, see the spec), so pw187's own first-run arithmetic
    # already covers it. If a first pw126 crawl ever needs more, raise this
    # then, with the measurement that showed it — not in advance of one.
    # 83 minutos é o que uma coleta completa do pw187 custa (1.666 × 3 s), e
    # o timeout era 75 — ou seja, uma coleta do zero **nunca** podia terminar,
    # e sem terminar nunca gravava a cache que a tornaria desnecessária. 120
    # dá folga para o pior caso mais o build.
    timeout-minutes: 120

    env:
      # `inputs.server` only exists on a `workflow_dispatch`; `schedule` and
      # `push` have no `inputs` at all, so this falls back to `pw187` for
      # both — the version that already has a public tool pointed at it.
      SERVIDOR: ${{ inputs.server || 'pw187' }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - run: flutter pub get

      # What the collector already read. Without it every run would be a fresh
      # 28-minute crawl, which is both slow and rude to the site.
      #
      # Both state files are listed, not just the one `$SERVIDOR` names this
      # run. `actions/cache` restores whatever is in the archive regardless of
      # which one this run touches, so listing only `pw187`'s file here would
      # silently never cache `tool/.collect_state_126.json` — every pw126 run
      # would then redo its full crawl, forever, with nothing on screen saying
      # why `--resume` stopped resuming.
      #
      # The key rotates so the cache is rewritten rather than appended to
      # (GitHub caches are immutable once written); restore-keys picks the most
      # recent previous one.
      # **Dois passos, um caminho cada, e isto não é arrumação.**
      #
      # `actions/cache` deriva a identidade de uma cache da **lista de
      # caminhos**. Em 01/10 acrescentei o segundo arquivo a este passo e isso
      # tornou inalcançáveis as 841 caches que existiam — chave a casar,
      # conteúdo lá, e invisíveis.
      #
      # O que se seguiu foi um laço fechado: sem cache o `--resume` não tem
      # estado e faz coleta completa; a coleta completa de 1.666 personagens a
      # 3 s cada precisa de **83 minutos** e o `timeout-minutes` cortava aos
      # 75; uma corrida que falha **não grava cache**. Nove horas sem deploy e
      # 32 cancelamentos, e nada disso sairia sozinho.
      #
      # Separados, cada cache mantém a sua lista de caminhos estável para
      # sempre, e acrescentar uma terceira versão nunca mais invalida as
      # outras duas.
      - name: Restaurar o estado do pw187
        uses: actions/cache@v4
        with:
          path: tool/.collect_state.json
          key: collect-state-${{ github.run_id }}
          restore-keys: collect-state-

      - name: Restaurar o estado do pw126
        uses: actions/cache@v4
        with:
          path: tool/.collect_state_126.json
          key: collect-state-126-${{ github.run_id }}
          restore-keys: collect-state-126-

      # Uma segunda tentativa, e ela é barata: o coletor salva o estado a cada
      # personagem, então `--resume` continua de onde parou em vez de recomeçar.
      #
      # **O que ela existe para absorver não é erro nosso.** Em 23/09 a VM do
      # Dart 3.12.2 deu segmentation fault dentro do próprio parser HTTP do
      # SDK, quatro segundos depois de começar. Sem retry isso custou uma hora
      # de índice velho — a coleta boa anterior era de 19:08, a seguinte só
      # sairia 20:07 — por um travamento que some ao tentar de novo.
      #
      # **Falhou duas vezes, a corrida quebra e o e-mail chega**, porque duas
      # vezes não é azar. E o aviso abaixo é deliberado: um retry esconde
      # frequência, e o dia em que isto passar a acontecer toda corrida tem de
      # ser visível no resumo da execução em vez de silencioso.
      - name: Coletar o mercado
        # O feed privado de chegadas. Ausente numa bifurcação do repositório e
        # ausente na máquina de quem desenvolve, e as duas coisas são de
        # propósito: sem a variável o coletor imprime quantas entradas teria
        # anunciado e não publica nada. Um `--rebuild` local nunca pode pôr
        # mensagem no canal de alguém.
        env:
          DISCORD_ALERTAS: ${{ secrets.DISCORD_ALERTAS }}
          ALERTAS_CATCHUP: ${{ inputs.catchup }}
        run: |
          dart run tool/collect.dart --server "$SERVIDOR" --resume && exit 0
          echo "::warning::A coleta caiu; segunda tentativa. Se isto virar rotina, deixou de ser azar."
          sleep 20
          dart run tool/collect.dart --server "$SERVIDOR" --resume

      # Um deploy publica o site inteiro, e esta corrida só colheu uma das
      # duas versões — a outra tem de vir do que já está no ar, ou este deploy
      # apagaria aquele mercado (os índices são gitignorados). Reaproveita
      # `_fetchPublishedIndex`, a mesma função que a memória de preço já usa
      # para ler o índice publicado; ver `tool/collect.dart` para o `--carry-
      # forward` e para a mesma decisão de abortar sem publicar que `main()`
      # já toma quando o seu PRÓPRIO índice publicado não vem.
      #
      # Vem logo depois da coleta, antes dos ícones e dos testes: numa corrida
      # do pw126, `web/market_index.json` só existe a partir deste passo, e
      # `presets_test` lê esse arquivo — o mercado real do 1.8.7.
      - name: Arrastar a versão que esta corrida não colheu
        run: |
          OUTRA=pw126
          if [ "$SERVIDOR" = "pw126" ]; then OUTRA=pw187; fi
          dart run tool/collect.dart --server "$OUTRA" --carry-forward

      # Skips everything already committed, so this costs nothing unless an
      # item appeared that nobody had worn before.
      - name: Baixar ícones novos
        run: dart run tool/fetch_icons.dart

      # An icon fetched here lives only for this run unless it is committed, so
      # a genuinely new item shows an empty box until someone commits it. The
      # name is always beside it, which is why that is tolerable.
      - name: Avisar sobre ícones não versionados
        run: |
          novos=$(git status --porcelain assets/icons | wc -l | tr -d ' ')
          if [ "$novos" != "0" ]; then
            echo "::notice::$novos ícones novos foram baixados e não estão no repositório. Rode 'dart run tool/fetch_icons.dart' localmente e comite."
          fi

      - run: flutter analyze
      - run: flutter test

      # Served from the root of portalpw.net, so the default base href of "/"
      # is right and no --base-href is needed. It was "/pw-market-filter/"
      # while the site lived on github.io: a subdirectory needs the prefix or
      # the page loads and nothing else does. If the custom domain is ever
      # removed, that flag has to come back.
      #
      # Icon tree-shaking takes MaterialIcons from 1.6 MB to 8 KB, and this app
      # uses about a dozen glyphs. Do not add --no-tree-shake-icons without a
      # reason: it costs every visitor 1.8 MB.
      #
      # Do not add --pwa-strategy=none to "turn off the service worker". It is
      # already off: since Flutter 3.35 the default strategy emits a 784-byte
      # worker whose only job is to unregister itself and reload the page, and
      # `none` emits an empty file that does not do that cleanup. Measured on
      # 3.44.8 and against the live site. Staleness here is the GitHub Pages
      # HTTP cache (max-age=600 on every file, not configurable), and it heals
      # itself in ten minutes.
      - name: Compilar
        run: flutter build web

      # Para fechar o site, é este caminho que muda para `fechado/` — a pasta
      # está no repositório com a página pronta, e o `crons` do Worker vai a
      # zero junto. Foi o que se fez entre 14 e 18/09/2026; o CLAUDE.md conta.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
          # **Um dia, e não os noventa do padrão.** O artefato carrega o
          # `market_index.json` inteiro — 3 MB do mercado deles — e num
          # repositório público qualquer pessoa baixa um artefato sem estar
          # logada. Noventa dias de coletas empilhadas é um arquivo histórico
          # do mercado que ninguém pediu e que nós não deveríamos estar
          # distribuindo.
          #
          # O deploy consome o artefato no passo seguinte, então nada aqui
          # depende de ele sobreviver à execução. Um dia é folga para
          # investigar uma execução que falhou, e é o mínimo que o Actions
          # aceita.
          #
          # Se o site fechar de novo, os artefatos existentes têm de ser
          # apagados na hora: bloquear a página e continuar servindo o mercado
          # por outra porta seria fechar a porta e deixar a janela aberta.
          retention-days: 1

      - id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
