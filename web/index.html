<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Replaced by `flutter build`. It is "/" since the site moved to the root
       of portalpw.net; on github.io it was the repository name. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- Without this the browser picks its own layout width, and Flutter lays
       the page out for a window wider than the one on screen: everything is
       centred on a number the viewport does not have, so the whole page sits
       to the right of centre with a band of empty space on the left. The
       Flutter template ships this line; ours had lost it. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <meta name="description"
        content="Ferramentas para o mercado de personagens do The Classic PW 1.8.7. Filtre por equipamento, cartas e atributos — o que o marketplace não deixa.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Portal PW">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-180.png">

  <!-- The mark is "PW" and not the logo. The logo is the word Portal over an
       ornate globe, and at the 16 px a tab actually gives you it renders as a
       red-brown smudge — checked side by side at 16, 32, 48 and 64. Two
       letters are the most that survives that size. -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png"/>

  <title>Portal PW</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* The page background before Flutter paints. Without it the browser's
       white flashes for the second the engine takes to boot, which on a dark
       site reads as a broken page. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #0B0B1A;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
