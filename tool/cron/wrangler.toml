name = "portalpw-cron"
main = "worker.js"
compatibility_date = "2026-08-29"

# Sem endereço público. O Worker não atende requisição nenhuma — só o cron o
# acorda. Ligar isso publicaria um `*.workers.dev` que dispararia a coleta
# para quem soubesse a URL, e cada coleta são ~1000 requisições ao marketplace.
workers_dev = false

# Três gatilhos, e a separação é o ponto.
#
# **`7` é a coleta, e é uma só para todos os mercados.** Até 06/10/2026 havia
# um horário por versão — `7` e `37` para o 1.8.7, `22` e `52` para o 1.2.6 —
# porque cada corrida colhia uma versão e arrastava a outra do que já estava
# publicado. Esse desenho caiu por dois motivos, e `publish.yml` conta ambos:
# o arrasto era um ler-modificar-escrever sobre estado partilhado, e quatro
# corridas por hora dão intervalos de quinze minutos que não cabem a coleta
# mais lenta medida, dezoito.
#
# Agora uma corrida colhe **todas** as versões, em jobs paralelos. Portanto
# não há versão a escolher no disparo, e uma versão nova não precisa de um
# horário novo — entra na matriz do workflow. `worker.js` tem de bater
# **string a string** com esta entrada (`CRON_DA_COLETA`); deixá-las divergir
# faz o ramo da coleta nunca disparar, caindo calado no keep-alive.
#
# **O que isto custa, e é de propósito:** cada mercado passa de duas
# actualizações por hora a uma. Em 06/10 a cadência densa deu o contrário do
# que prometia — três cancelamentos seguidos e o índice do 1.8.7 hora e meia
# parado, pior do que a hora que a esparsa garante. A frescura volta a
# discutir-se quando houver medição que a suporte, e o `CLAUDE.md` tem os
# números.
#
# **A conta que torna uma hora suficiente:** os 83 minutos do
# `timeout-minutes` em `publish.yml` são só a primeira coleta de cada versão.
# Depois dela, `--resume` busca a listagem — um pedido — e só os detalhes de
# roleids nunca vistos; em regime a corrida leva segundos.
#
[triggers]
crons = [
  "7 * * * *",
  "13 4 * * *",
  "*/5 * * * *",
]
