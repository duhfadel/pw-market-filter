name: Publicar

# **O site está fechado desde 14/09/2026, e este arquivo é o que o mantém
# fechado.**
#
# Ele coletava o marketplace do The Classic a cada trinta minutos, compilava o
# app Flutter e publicava filtro, guias e mapa. Depois de um mês de tickets, a
# equipe do The Classic respondeu que não tem interesse em parcerias externas —
# e sem autorização nada disso continua. Continuar varrendo o site deles 48
# vezes por dia seria dizer uma coisa na home e fazer outra.
#
# Então: sem `schedule`, sem coleta, sem build. O que sobe é `fechado/`, uma
# página estática com a mensagem. O `market_index.json` deixou de ser
# publicado junto com o resto — bloquear a página e continuar servindo 3 MB do
# mercado deles seria fechar a porta e deixar a janela aberta.
#
# **Nada foi apagado.** O coletor, o app, os guias e o mapa continuam no
# repositório, e reabrir o site é desfazer o commit que trouxe este arquivo a
# este estado. O cron da Cloudflare em `tool/cron/` também foi desligado e
# precisa voltar junto.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nunca um deploy pela metade. Sobrou de quando havia coleta; com uma página
# estática o grupo custa nada e evita duas publicações se dois pushes caírem
# juntos.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # A mesma página responde a qualquer endereço antigo. Os links de
      # /filtro, /guias e /guerras já foram compartilhados por aí, e quem
      # clicar neles tem que ler a mensagem, não um 404 do GitHub.
      #
      # É uma cópia feita aqui, e não um arquivo comitado, para não existirem
      # duas páginas capazes de discordar uma da outra.
      - name: A mesma mensagem para qualquer endereço
        run: cp fechado/index.html fechado/404.html

      # Só a página fechada. O CNAME vive dentro de `fechado/` porque o Pages
      # lê o domínio do que é publicado, não do repositório — sem ele o
      # portalpw.net cai no dia seguinte.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: fechado

      - id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
