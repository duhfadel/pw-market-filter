name: Coletar e publicar

# **Sem nome de versão desde 06/10/2026: uma corrida colhe todas.** O título
# costumava trazer o mercado porque cada corrida colhia um, e `worker.js` lia
# daqui qual redisparar. Com a matriz abaixo isso deixou de fazer sentido — e
# `ressuscitarColeta` deixou de precisar de o saber.
run-name: Coletar e publicar

# Every thirty minutes, at :07 and :37 — and the odd minutes are the point.
#
# **`schedule` is best effort, and the measurement is much worse than the
# docs suggest.** Asking for `*/20` never once delivered twenty minutes: over
# 26–29/08 the gap between scheduled runs went from ~45 minutes to 2 hours to
# 10, and one stretch reached 12h15 with no run at all. Nothing failed and
# nothing was cancelled — the schedule simply did not fire. The repository is
# public, so Actions minutes are unlimited; this is GitHub shedding load, and
# a busier cron is the first thing it sheds.
#
# So the times avoid the top of the hour, which GitHub names as its worst
# window, and the rate asks for less. Neither is a guarantee. If the gaps stay
# in hours, the fix is not in this file: it is an external cron — a Cloudflare
# Worker, where the site already lives — calling `workflow_dispatch`.
#
# The collection date is on screen for exactly this reason, and it is what
# tells a visitor the market went stale.
#
# **Este horário é o recurso lento, e já não nomeia versão nenhuma**: a
# corrida colhe todas de uma vez, portanto um disparo do `schedule` faz
# exactamente o mesmo que um do Worker. Era preciso escolher uma versão
# enquanto cada corrida colhia uma só.
on:
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # O levantamento único de um item que acabou de entrar na vigia. Só
      # existe em disparo manual e nunca no horário, de propósito: lista quem
      # **já** carrega, e o horário repeti-lo-ia de meia em meia hora para
      # sempre. O feed normal responde à outra pergunta, quem acabou de
      # chegar, e essa é dita uma vez por pessoa.
      catchup:
        description: 'Listar quem já carrega este item (nome exato, opcional)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# Uma corrida de cada vez, e nunca um deploy escrito a meio.
#
# **A razão antiga era que as versões se alternavam entre corridas; agora
# elas correm dentro da mesma.** O que continua a exigir o grupo é o GitHub
# Pages: há um deployment e um artefato `github-pages` por repositório, e
# dois deploys em paralelo publicam metade de cada um.
#
# Com uma corrida por hora a colher tudo, isto deixou de ser o freio que
# decide a frescura do site e passou a ser só a rede de segurança para um
# `push` que caia em cima do horário. Ver CLAUDE.md sobre 06/10/2026: quatro
# corridas por hora davam intervalos de quinze minutos, e a coleta mais lenta
# medida leva dezoito.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # **Um job por versão, em paralelo — e a razão é o pior caso, não o comum.**
  #
  # Em regime normal uma coleta leva 3 a 5 minutos e tanto faz; o que decide é
  # a recolha completa, que acontece quando o carimbo de `CollectedPage` muda.
  # Em sequência, duas somam 83 + 65 = 148 minutos contra um tecto de 120 —
  # não cabe. Em paralelo são `max(83, 65)` = 83, e com uma quarta versão a
  # soma deixa de caber em tecto nenhum enquanto o máximo continua a caber.
  #
  # **E isto mata o `--carry-forward` como caminho normal.** Enquanto cada
  # corrida colhia um mercado, ela tinha de ir buscar o outro ao site e
  # republicá-lo: ler, modificar, escrever, sobre estado partilhado. Duas
  # corridas ao mesmo tempo perdiam dados sem nada falhar. Colhidas todas na
  # mesma corrida, o arrasto sobra só para a versão cuja coleta falhou.
  #
  # Uma versão nova é um bloco aqui e uma entrada em `lib/collector/
  # servidor.dart`. Se alguém esquecer este bloco, o job de publicação avisa
  # que o índice não chegou — falha alto em vez de calado.
  colher:
    runs-on: ubuntu-latest
    # 83 minutos é o que uma coleta completa do pw187 custa (1.666 × 3 s), e o
    # tecto era 75 — ou seja, uma coleta do zero **nunca** podia terminar, e
    # sem terminar nunca gravava a cache que a tornaria desnecessária. Agora
    # que cada versão tem o seu job, este tecto é por versão e não pela soma.
    timeout-minutes: 120

    strategy:
      # Uma versão que falha não pode levar as outras: o site prefere um
      # mercado velho a dois.
      fail-fast: false
      matrix:
        include:
          - servidor: pw187
            estado: tool/.collect_state.json
            # **O prefixo da chave é de 2026-08 e não pode mudar.** Uma chave
            # nova não encontra as caches que existem, e sem cache o
            # `--resume` faz coleta completa — foi assim que 01/10 começou.
            cache: collect-state-
            indice: web/market_index.json
          - servidor: pw126
            estado: tool/.collect_state_126.json
            cache: collect-state-126-
            indice: web/market_index_126.json

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - run: flutter pub get

      # O que o coletor já leu. Sem isto cada corrida seria um rastreio
      # completo, que é lento e indelicado com o site deles.
      #
      # **Um caminho por job, e isto não é arrumação.** `actions/cache` deriva
      # a identidade de uma cache da **lista de caminhos**; em 01/10
      # acrescentar um segundo ficheiro ao mesmo passo tornou inalcançáveis as
      # 841 caches que existiam — chave a casar, conteúdo lá, invisíveis. Com
      # um job por versão cada lista fica estável para sempre, por construção.
      #
      # A chave roda para a cache ser reescrita em vez de acrescentada (uma
      # cache do GitHub é imutável depois de escrita); `restore-keys` apanha a
      # mais recente anterior.
      - name: Restaurar o estado do ${{ matrix.servidor }}
        uses: actions/cache@v4
        with:
          path: ${{ matrix.estado }}
          key: ${{ matrix.cache }}${{ github.run_id }}
          restore-keys: ${{ matrix.cache }}

      # Uma segunda tentativa, e ela é barata: o coletor salva o estado a cada
      # personagem, então `--resume` continua de onde parou em vez de recomeçar.
      #
      # **O que ela existe para absorver não é erro nosso.** Em 23/09 a VM do
      # Dart 3.12.2 deu segmentation fault dentro do próprio parser HTTP do
      # SDK, quatro segundos depois de começar. Sem retry isso custou uma hora
      # de índice velho — a coleta boa anterior era de 19:08, a seguinte só
      # sairia 20:07 — por um travamento que some ao tentar de novo.
      #
      # **Falhou duas vezes, a corrida quebra e o e-mail chega**, porque duas
      # vezes não é azar. E o aviso abaixo é deliberado: um retry esconde
      # frequência, e o dia em que isto passar a acontecer toda corrida tem de
      # ser visível no resumo da execução em vez de silencioso.
      - name: Coletar o mercado
        # O feed privado de chegadas. Ausente numa bifurcação do repositório e
        # ausente na máquina de quem desenvolve, e as duas coisas são de
        # propósito: sem a variável o coletor imprime quantas entradas teria
        # anunciado e não publica nada. Um `--rebuild` local nunca pode pôr
        # mensagem no canal de alguém.
        env:
          DISCORD_ALERTAS: ${{ secrets.DISCORD_ALERTAS }}
          ALERTAS_CATCHUP: ${{ inputs.catchup }}
        run: |
          dart run tool/collect.dart --server ${{ matrix.servidor }} --resume && exit 0
          echo "::warning::A coleta caiu; segunda tentativa. Se isto virar rotina, deixou de ser azar."
          sleep 20
          dart run tool/collect.dart --server ${{ matrix.servidor }} --resume

      # O índice viaja para o job de publicação como artefato.
      #
      # **Um dia, como o do Pages, e pela mesma razão.** Carrega o mercado
      # deles inteiro, e num repositório público qualquer pessoa descarrega um
      # artefato sem sessão iniciada. Se o site fechar de novo, estes têm de
      # ser apagados na hora junto com o outro.
      #
      # `if-no-files-found: error` de propósito: um índice que não existe tem
      # de parar aqui, onde se sabe porquê, e não no job seguinte a arrastar
      # silenciosamente o do site.
      - name: Guardar o índice do ${{ matrix.servidor }}
        uses: actions/upload-artifact@v4
        with:
          name: indice-${{ matrix.servidor }}
          path: ${{ matrix.indice }}
          retention-days: 1
          if-no-files-found: error

  publicar:
    needs: colher
    # **Mesmo com uma coleta falhada**, e é essa a razão de o arrasto existir:
    # o site continua de pé com o mercado que sobreviveu, e o que falhou vem
    # do que já está no ar. Sem isto, uma falha de uma versão tirava o site
    # inteiro do ar durante uma hora.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Trazer os índices colhidos
        uses: actions/download-artifact@v4
        with:
          pattern: indice-*
          merge-multiple: true
          path: web

      # **Duas ausências diferentes, e só uma delas é aceitável.**
      #
      # "Esta versão não foi colhida nesta corrida" é um facto normal — a
      # coleta dela falhou, as outras seguiram, e o arrasto resolve. "Foi
      # colhida e o ficheiro perdeu-se entre os jobs" é um defeito nosso, e
      # arrastar nesse caso publicaria dados velhos com a corrida verde: o
      # pior resultado possível, porque ninguém fica a saber.
      #
      # `needs.colher.result` é o que as separa: se **todas** as coletas
      # passaram, um índice em falta só pode ser ficheiro perdido.
      #
      # A lista das versões vem do próprio coletor, nunca escrita aqui — ver
      # `Servidor.todos`. Uma versão nova que entre lá e não aqui na matriz
      # cai neste aviso em vez de desaparecer calada.
      - name: Conferir o que chegou
        run: |
          falhou=0
          while IFS=$'\t' read -r chave indice _; do
            # `if` e não `[ -f ... ] && continue`, e por legibilidade e não
            # por perigo: medido, a forma `&&` não aborta sob `bash -e`,
            # porque o teste é o primeiro comando da lista e a sua falha é
            # ignorada. O `if` diz em voz alta qual é o caso interessante.
            if [ -f "$indice" ]; then
              continue
            fi
            if [ "${{ needs.colher.result }}" = "success" ]; then
              echo "::error::$indice não chegou, mas todas as coletas passaram — o artefato perdeu-se entre os jobs."
              falhou=1
            else
              echo "::warning::$chave não foi colhido nesta corrida; vai ser arrastado do site."
            fi
          done < <(dart run tool/collect.dart --listar)
          exit $falhou

      # Um deploy publica o site inteiro, portanto uma versão que não foi
      # colhida tem de vir do que já está no ar, ou este deploy apagaria
      # aquele mercado (os índices são gitignorados). Reaproveita
      # `_fetchPublishedIndex`, a mesma função que a memória de preço usa; ver
      # `tool/collect.dart` para o `--carry-forward` e para a decisão de
      # abortar sem publicar quando o índice publicado não vem.
      #
      # **Deixou de correr em todas as corridas.** Enquanto cada corrida
      # colhia um mercado, isto acontecia sempre e era o que tornava duas
      # corridas simultâneas perigosas. Agora é excepção.
      - name: Arrastar as versões que não foram colhidas
        run: |
          while IFS=$'\t' read -r chave indice _; do
            [ -f "$indice" ] || dart run tool/collect.dart --server "$chave" --carry-forward
          done < <(dart run tool/collect.dart --listar)

      # Skips everything already committed, so this costs nothing unless an
      # item appeared that nobody had worn before.
      - name: Baixar ícones novos
        run: dart run tool/fetch_icons.dart

      # An icon fetched here lives only for this run unless it is committed, so
      # a genuinely new item shows an empty box until someone commits it. The
      # name is always beside it, which is why that is tolerable.
      - name: Avisar sobre ícones não versionados
        run: |
          novos=$(git status --porcelain assets/icons | wc -l | tr -d ' ')
          if [ "$novos" != "0" ]; then
            echo "::notice::$novos ícones novos foram baixados e não estão no repositório. Rode 'dart run tool/fetch_icons.dart' localmente e comite."
          fi

      - run: flutter analyze
      - run: flutter test

      # Served from the root of portalpw.net, so the default base href of "/"
      # is right and no --base-href is needed. It was "/pw-market-filter/"
      # while the site lived on github.io: a subdirectory needs the prefix or
      # the page loads and nothing else does. If the custom domain is ever
      # removed, that flag has to come back.
      #
      # Icon tree-shaking takes MaterialIcons from 1.6 MB to 8 KB, and this app
      # uses about a dozen glyphs. Do not add --no-tree-shake-icons without a
      # reason: it costs every visitor 1.8 MB.
      #
      # Do not add --pwa-strategy=none to "turn off the service worker". It is
      # already off: since Flutter 3.35 the default strategy emits a 784-byte
      # worker whose only job is to unregister itself and reload the page, and
      # `none` emits an empty file that does not do that cleanup. Measured on
      # 3.44.8 and against the live site. Staleness here is the GitHub Pages
      # HTTP cache (max-age=600 on every file, not configurable), and it heals
      # itself in ten minutes.
      - name: Compilar
        run: flutter build web

      # Para fechar o site, é este caminho que muda para `fechado/` — a pasta
      # está no repositório com a página pronta, e o `crons` do Worker vai a
      # zero junto. Foi o que se fez entre 14 e 18/09/2026; o CLAUDE.md conta.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
          # **Um dia, e não os noventa do padrão.** O artefato carrega o
          # `market_index.json` inteiro — 3 MB do mercado deles — e num
          # repositório público qualquer pessoa baixa um artefato sem estar
          # logada. Noventa dias de coletas empilhadas é um arquivo histórico
          # do mercado que ninguém pediu e que nós não deveríamos estar
          # distribuindo.
          #
          # O deploy consome o artefato no passo seguinte, então nada aqui
          # depende de ele sobreviver à execução. Um dia é folga para
          # investigar uma execução que falhou, e é o mínimo que o Actions
          # aceita.
          #
          # Se o site fechar de novo, os artefatos existentes têm de ser
          # apagados na hora: bloquear a página e continuar servindo o mercado
          # por outra porta seria fechar a porta e deixar a janela aberta.
          retention-days: 1

      # **A API de artefatos não é consistente consigo própria, e a janela é de
      # menos de meio segundo.** Duas vezes em 05/10/2026 o upload terminou
      # com sucesso — ID e tamanho impressos — e o `deploy-pages` perguntou
      # pelo mesmo artefato logo a seguir e recebeu `Found 0 artifact(s)`:
      # 387 ms de intervalo às 15:18, 464 ms às 19:10. Em ambos os casos a
      # execução inteira — coleta de quarenta minutos incluída — foi perdida
      # por causa disso.
      #
      # A mensagem do próprio `deploy-pages` manda olhar o `githubstatus.com`
      # e tentar mais tarde, o que confirma de quem é o problema; o que ela
      # não diz é que esperar meio segundo resolve.
      #
      # Espera até a API admitir o que acabou de aceitar, no máximo um minuto.
      # Não falha se o tempo acabar: deixa o `deploy-pages` falhar com a
      # mensagem dele, que é mais informativa do que um `exit 1` daqui — e
      # nesse caso o problema é outro, não esta corrida.
      - name: Esperar o artefato aparecer na API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tentativa in $(seq 1 20); do
            if gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
                 --jq '.artifacts[].name' | grep -qx 'github-pages'; then
              echo "artefato visível na tentativa $tentativa"
              exit 0
            fi
            sleep 3
          done
          echo "::warning::a API ainda não lista o artefato depois de 60 s"

      - id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
