<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Replaced by `flutter build`. It is "/" since the site moved to the root
       of portalpw.net; on github.io it was the repository name. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- Without this the browser picks its own layout width, and Flutter lays
       the page out for a window wider than the one on screen: everything is
       centred on a number the viewport does not have, so the whole page sits
       to the right of centre with a band of empty space on the left. The
       Flutter template ships this line; ours had lost it. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <meta name="description"
        content="Ache o personagem certo pelo que ele está usando. Filtre os personagens à venda do The Classic PW 1.8.7 por arma, cartas, refino e atributos.">

  <!-- What the link becomes when it is pasted into the group's Discord or a
       WhatsApp conversation. Without these it arrives as a bare line of text,
       next to screenshots of the game, and loses.

       The image is JPEG and not WebP: WhatsApp is unreliable with WebP in a
       preview. It is 135 KB because past roughly 300 KB WhatsApp gives up
       fetching it and shows the bare link again — the thing these tags exist
       to prevent.

       Replacing the art later means shipping it under a NEW file name. Preview
       scrapers and Cloudflare both cache it hard, and an overwrite is served
       as the old picture for as long as they feel like it. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Portal PW">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Portal PW — filtro do marketplace">
  <meta property="og:description"
        content="Ache o personagem certo pelo que ele está usando: arma, cartas, refino e atributos dos personagens à venda no The Classic PW 1.8.7.">
  <meta property="og:url" content="https://portalpw.net/">
  <meta property="og:image" content="https://portalpw.net/og.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Portal PW — ache o personagem certo pelo que ele está usando">
  <meta name="twitter:card" content="summary_large_image">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Portal PW">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-180.png">

  <!-- The mark is "PW" and not the logo. The logo is the word Portal over an
       ornate globe, and at the 16 px a tab actually gives you it renders as a
       red-brown smudge — checked side by side at 16, 32, 48 and 64. Two
       letters are the most that survives that size.

       favicon.ico is not redundant with the PNG. Chrome asks for /favicon.ico
       by name in the places that have no page to read a <link> from — a new
       tab, the history list, a bookmark — and while it 404'd there, those
       places kept showing whatever they had cached, which was Flutter's
       default. It holds 16, 32, 48 and 64 as separate bitmaps so the browser
       picks one instead of squeezing 64 down to 16.

       The ?v= is what evicts the old icon. A favicon lives in its own store
       that ordinary cache headers do not reach, so changing the bytes behind
       the same URL can leave the previous picture on screen for weeks. Bump it
       whenever the mark changes. -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=2"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=2"/>

  <title>Portal PW</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* The page background before Flutter paints. Without it the browser's
       white flashes for the second the engine takes to boot, which on a dark
       site reads as a broken page. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #0B0B1A;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
